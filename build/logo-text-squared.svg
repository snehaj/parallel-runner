<!-- PLACEHOLDER wordmark — regenerated as a live <text> element, not glyph-outline
     paths like the original. This renders fine in a browser/README but is NOT
     suitable for use as an actual app icon/build resource (font may not be
     present at render time in every context). Needs a proper redo (font
     converted to path outlines) as a follow-up design task. Widened from the
     original 336x56 viewBox — "Paralell Runner" is longer than "Parallel Code". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 56" fill="none" stroke="#2ec8ff" stroke-width="4">

  <!-- Parallel lines -->
  <line x1="10" y1="6" x2="10" y2="50"/>
  <line x1="22" y1="6" x2="22" y2="50"/>

  <!-- ] bracket (top) -->
  <path d="M30 8 H47 V24 H30"/>
  <!-- [ bracket (bottom) -->
  <path d="M49 32 H32 V48 H49"/>

  <!-- "Paralell Runner" -->
  <text x="68" y="38" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" fill="#2ec8ff" stroke="none">Paralell Runner</text>
</svg>
